# Czy życie ma być tracone TYLKO gdy gracz zostanie zabity przez innego gracza?
# true  = tylko śmierć z rąk gracza zabiera życie
# false = każda śmierć zabiera życie
player-death-only: false

# Domyślna liczba żyć przy pierwszym dołączeniu
default-lives: 5

# Maksymalna liczba żyć jaką gracz może mieć (za zabójstwa nie przekroczy)
max-lives: 5

# Ile żyć dostaje gracz po odbanowaniu (po utracie wszystkich)
lives-after-ban: 3

# Czas bana w godzinach
ban-duration-hours: 48

# Powód bana
ban-reason: "Straciłeś wszystkie życia! Wróć za 48 godzin."
